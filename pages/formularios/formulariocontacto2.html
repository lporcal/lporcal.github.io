<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre Formulario de Contacto</title>
    <link rel="stylesheet" type="text/css" href="../../estilos.proyecto.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
</head>

<body>
<div>
        <div class="container" style="height: 100px;">
            <div class="row">
                <div class="col-md-11">
                    <div class="well well-sm" style="margin-top: 30px;">
                        <fieldset>
                            <legend class="letrafija">Contacto</legend>

                            <li>&nbsp;</li>
                            <li>&nbsp;</li>

                            <div style="text-align: center; padding: 20px 0;">
                                <p style="font-size: 40px; margin-bottom: 10px;">✅</p>
                                <h3 class="letraclara" style="font-style: italic;">¡Mensaje enviado!</h3>
                                <h5 class="letraclara" style="font-style: italic; opacity: 0.8;">
                                    Gracias por comunicarte,<br>
                                    a la brevedad estaré respondiendo.
                                </h5>
                            </div>

                            <li>&nbsp;</li>
                            <li>&nbsp;</li>

                            <div class="col-md-12 text-center" style="margin-top: 20px;">
                                <button type="button" class="btn btn-primary btn-lg"
                                    style="border-color: rgba(124, 133, 46, 0.938); background: linear-gradient(to right, #5b5c56, #646950);"
                                    onclick="window.close()">
                                    Cerrar ventana
                                </button>
                            </div>

                        </fieldset>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="../../programa.proyectofinal.js"></script>
