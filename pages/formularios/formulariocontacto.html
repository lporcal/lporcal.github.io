<!DOCTYPE html>
<html lang="es">

<head>
    <script src="../../cookie-consent.js"></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Porcal - Formulario de Contacto</title>
    <link rel="stylesheet" type="text/css" href="../../estilos.proyecto.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dancing+Script&family=Fuggles&family=Mooli&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        emailjs.init('OsFq8wos0_Hs2mtiW');
    </script>
    <link rel="icon" type="image/x-icon" href="../../Iconos/logo_portfolio.ico" />  
</head>

<body>

    <!-- TÍTULO SUPERIOR -->
    <div
        style="background-color: rgba(0,0,0,0.5); width: fit-content; padding: 20px 30px; border-radius: 20px; margin: 30px 0 0 5%; max-width: 90%; border:1.5px solid #d4c547;">
        <h6 style="color:rgba(201,222,248,0.938);"><i class="fa-solid fa-location-dot"></i> Córdoba, Argentina</h6>
            <div style="margin-top: 20px;"></div>
            <h1>
                <span style="color:rgba(201,222,248,0.938);">LUCAS</span>
                <span style="color:rgba(126, 167, 222, 0.938);">PORCAL</span>
            </h1>
            <div style="margin-top: 20px;"></div>        
        <h6 style="color: rgba(201,222,248,0.938); margin: 0; font-style: italic;">
            Ingeniero Químico | Analista de Datos | Procesos Industriales
        </h6>
    </div>

    <div>
        <div class="container" style="height: 700px;">
            <div class="row">
                <div class="col-md-11">
                    <div class="well well-sm" style="margin-top:30px">
                        <form class="form-horizontal" id="formularioContacto">
                            <fieldset>
                                <legend class="letrafija">Contacto</legend>

                                <div class="form-group" style="opacity: 0.8">
                                    <span class="col-md-1 col-md-offset-2 text-center"><i
                                            class="fa fa-user bigicon"></i></span>
                                    <div class="col-md-8">
                                        <input id="fname" name="nombre" type="text" placeholder="Nombre"
                                            class="form-control" required>
                                    </div>
                                </div>

                                <li>&nbsp;</li>

                                <div class="form-group" style="opacity: 0.8;">
                                    <span class="col-md-1 col-md-offset-2 text-center"><i
                                            class="fa fa-user bigicon"></i></span>
                                    <div class="col-md-8">
                                        <input id="lname" name="apellido" type="text" placeholder="Apellido"
                                            class="form-control" required>
                                    </div>
                                </div>

                                <li>&nbsp;</li>

                                <div class="form-group" style="opacity: 0.8">
                                    <span class="col-md-1 col-md-offset-2 text-center"><i
                                            class="fa fa-envelope-o bigicon"></i></span>
                                    <div class="col-md-8">
                                        <input id="email" name="email" type="email" placeholder="E-mail"
                                            class="form-control" required>
                                    </div>
                                </div>

                                <li>&nbsp;</li>

                                <div class="form-group" style="opacity: 0.8">
                                    <span class="col-md-1 col-md-offset-2 text-center"><i
                                            class="fa fa-phone-square bigicon"></i></span>
                                    <div class="col-md-8">
                                        <input id="phone" name="telefono" type="text" placeholder="Teléfono"
                                            class="form-control">
                                    </div>
                                </div>

                                <li>&nbsp;</li>

                                <div class="form-group" style="opacity: 0.8">
                                    <span class="col-md-1 col-md-offset-2 text-center"><i
                                            class="fa fa-pencil-square-o bigicon"></i></span>
                                    <div class="col-md-8">
                                        <textarea class="form-control" id="message" name="mensaje"
                                            placeholder="Por favor, deje aquí su mensaje. Lo contactaré lo antes posible"
                                            rows="7" required></textarea>
                                    </div>
                                </div>

                                <!-- Mensaje de estado -->
                                <div class="col-md-12 text-center" style="margin-bottom: 10px;">
                                    <p id="mensajeEstado" style="display:none; font-weight: bold;"></p>
                                </div>

                                <div class="form-group" style="margin-top:50px;">
                                    <div class="col-md-12 text-center">
                                        <button type="button" id="btnEnviar" class="btn btn-primary btn-lg"
                                            style="background-color: rgba(0,0,0,0.5); width: fit-content; padding: 10px 10px; border-radius: 10px; margin: 0 0 0 5%; max-width: 90%; border:1.5px solid #d4c547;"
                                            onclick="enviarFormulario()">
                                            Enviar
                                        </button>
                                    </div>
                                </div>

                            </fieldset>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function enviarFormulario() {
            const nombre = document.getElementById('fname').value.trim();
            const apellido = document.getElementById('lname').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensaje = document.getElementById('message').value.trim();
            const estado = document.getElementById('mensajeEstado');
            const btn = document.getElementById('btnEnviar');

            // Validación básica
            if (!nombre || !apellido || !email || !mensaje) {
                estado.style.display = 'block';
                estado.style.color = 'orange';
                estado.textContent = 'Por favor completá los campos obligatorios.';
                return;
            }

            // Deshabilitar botón mientras envía
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            estado.style.display = 'none';

            const templateParams = {
                nombre: nombre,
                apellido: apellido,
                email: email,
                telefono: document.getElementById('phone').value.trim() || 'No informado',
                mensaje: mensaje
            };

            emailjs.send('service_3hafhq9', 'template_ciz9s79', templateParams)
                .then(function () {
                    // Éxito: mostrar ventana de agradecimiento
                    window.location.href = 'formulariocontacto2.html';
                }, function (error) {
                    // Error: mostrar mensaje
                    estado.style.display = 'block';
                    estado.style.color = 'red';
                    estado.textContent = 'Hubo un error al enviar el mensaje. Intentá nuevamente.';
                    btn.disabled = false;
                    btn.textContent = 'Enviar';
                    console.error('Error EmailJS:', error);
                });
        }
    </script>

    <script src="../../programa.proyectofinal.js"></script>
</body>

</html>
